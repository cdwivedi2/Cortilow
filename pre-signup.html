<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cortilow Pre‑Signup</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    form {
      background: white;
      padding: 25px;
      border-radius: 10px;
      width: 320px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 15px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      background: #0078d7;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #005fa3;
    }

    #message {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <form id="preSignupForm">
    <h2>Join the Cortilow Waitlist</h2>

    <input type="text" id="name" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email Address" required>
    <input type="text" id="interest" placeholder="What interests you?" required>

    <button type="submit">Join Waitlist</button>

    <div id="message"></div>
  </form>

  <script>
    document.getElementById("preSignupForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        interest: document.getElementById("interest").value
      };

      const messageBox = document.getElementById("message");
      messageBox.textContent = "Submitting...";

      try {
        const response = await fetch("https://cortilow.onrender.com/pre-signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          messageBox.style.color = "green";
          messageBox.textContent = "Thanks! You're on the waitlist.";
        } else {
          messageBox.style.color = "red";
          messageBox.textContent = "Something went wrong. Try again.";
        }
      } catch (err) {
        messageBox.style.color = "red";
        messageBox.textContent = "Server unreachable.";
      }
    });
  </script>

</body>
</html>
